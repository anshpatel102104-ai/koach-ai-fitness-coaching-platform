name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build is the hard gate — it must stay green.
      - name: Build
        run: npm run build
        env:
          # Placeholder values so the app boots in the smoke test (no real backend is contacted).
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      # Pure checks for the billing access rules / Stripe plan mapping (no network or DB).
      - name: Billing rules check
        run: npm run verify:billing

      # Serves the built app and fails on any runtime page error / blank page.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: node scripts/smoke.mjs

      # Lint and typecheck are reported but non-blocking for now: the repo
      # carries a known backlog (ESLint problems + pre-existing tsc errors). Flip continue-on-error to false once that backlog
      # is cleared so these become enforced gates.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true
