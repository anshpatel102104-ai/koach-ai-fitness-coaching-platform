<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1D2027" />
  <title>Offline · KOACH</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #EEEFF1;
      color: #111318;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    header { background: #1D2027; padding: 16px 20px; }
    header img { height: 24px; width: auto; display: block; }
    main {
      flex: 1;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 { font-size: 32px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.6; color: #5E6470; }
    button {
      margin-top: 24px;
      background: #111318;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      height: 48px;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:focus-visible { outline: 2px solid #0A5CFF; outline-offset: 2px; }
    .note {
      margin-top: 16px;
      padding: 14px 16px;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(226, 228, 232, 0.6);
      font-size: 14px;
      color: #111318;
    }
  </style>
</head>
<body>
  <header><img src="/koach-logo-white.png" alt="KOACH" /></header>
  <main>
    <h1>You're offline.</h1>
    <p>Check your connection. What you've already opened is saved on this device.</p>
    <button onclick="window.location.reload()">Try again</button>
    <div class="note">Workouts and logs you save while offline sync when you're back.</div>
  </main>
</body>
</html>
